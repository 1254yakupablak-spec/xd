<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>KOKLEYİCİ SPORTS</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img class="app-logo" src="icons/icon48.png" alt="">
    <h1>KOKLEYİCİ SPORTS</h1>
    <span id="version"></span>
  </header>
  <button id="open-update" class="btn btn--wide update-btn">Güncellemeleri denetle</button>

  <section>
    <h2>Durum</h2>
    <div class="stat"><i id="st-foot-dot" class="dot"></i><span>Futbol maçları</span><b id="st-foot">…</b></div>
    <div class="stat"><i id="st-bk-dot" class="dot"></i><span>NBA maçları</span><b id="st-bk">…</b></div>
    <div class="stat"><i id="st-live-dot" class="dot"></i><span>Şu an canlı</span><b id="st-live">…</b></div>
    <div class="stat"><i id="st-xbet-dot" class="dot"></i><span>1xBet oranları</span><b id="st-xbet">…</b></div>
    <div class="stat"><i id="st-stake-dot" class="dot"></i><span>Stake oranları</span><b id="st-stake">…</b></div>
    <div class="stat"><i id="st-notes-dot" class="dot"></i><span>Maç notları</span><b id="st-notes">…</b></div>
    <div class="stat"><i class="dot dot--info"></i><span>Saklanan YZ tahmini</span><b id="st-ai">…</b></div>
    <button id="refresh-data" class="btn btn--wide btn--sm">Maç verisini şimdi yenile</button>
    <p id="refresh-note" class="note"></p>
  </section>

  <details>
    <summary>Ayarlar</summary>

    <label class="field-label" for="xbet-host">1xBet adresi</label>
    <div class="line">
      <input id="xbet-host" class="input" type="text" placeholder="1xbet.com" spellcheck="false">
      <button id="xbet-host-save" class="btn">Kaydet</button>
    </div>
    <p id="xbet-host-note" class="note"></p>

    <p class="note">Özellikleri (canlı skor, arbitraj, bilgiler, kâr/zarar) 6q sayfasındaki panelin "Özellikler" listesinden açıp kapat.</p>
  </details>

  <script src="popup.js"></script>
</body>
</html>
